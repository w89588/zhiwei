name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        default: v1.0.0

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected vMAJOR.MINOR.PATCH' }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install locked dependencies and test
        shell: pwsh
        run: |
          if ((Get-Content VERSION -Raw).Trim() -ne $env:RELEASE_TAG.Substring(1)) { throw 'Tag and VERSION differ' }
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Virtual environment failed' }
          & .\.venv\Scripts\python.exe -m pip install -r requirements-dev-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          & .\.venv\Scripts\python.exe -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }

      - name: Build and verify installer
        shell: pwsh
        run: |
          $compiler = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler missing from Windows runner' }
          & ./build-release.ps1 -Compiler $compiler
          & ./tools/verify_installer.ps1 -Version $env:RELEASE_TAG.Substring(1)

      - name: Upload verified files to existing draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $draft = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'Upload requires an existing draft release' }
          gh release upload $env:RELEASE_TAG ./release/*.exe ./release/*.zip ./release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
